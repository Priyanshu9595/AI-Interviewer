# Render blueprint for the backend.
#
# The frontend belongs on Vercel and needs nothing here — it is static pages and
# does not drive a browser. This is only the API, the scheduler and the meeting
# bot, all of which need a process that stays alive.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repository.
# Then set the secrets marked `sync: false` in the dashboard.

services:
  - type: web
    name: ai-interview-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    # This service is configured for the free tier.
    # Note: Free instances sleep after 15 minutes of inactivity. You must use a
    # ping service (like cron-job.org) to hit /health if you want the bot to auto-join.
    plan: free
    healthCheckPath: /health
    # The interview state machine lives in memory and the scheduler must run in
    # exactly one place, so this service does not scale horizontally.
    numInstances: 1


    envVars:
      - key: NODE_ENV
        # Also what makes the refresh cookie SameSite=None; Secure, without
        # which a Vercel frontend on another domain cannot stay signed in.
        value: production
      - key: PORT
        value: 5000

      # Where candidates are sent. Must be the Vercel frontend, and that
      # deployment must be running a build that has /interview/[token]/code.
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false

      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      # Required: a bot in a meeting has no browser to fall back to for speech.
      - key: DEEPGRAM_API_KEY
        sync: false

      - key: GOOGLE_BOT_COOKIES
        sync: false
      - key: MEET_BOT_ENABLED
        value: "true"
      - key: GOOGLE_BOT_PROFILE_PATH
        value: /tmp/meet-bot-profile
      # The Playwright image ships Chromium, not Google Chrome. Naming it
      # avoids a failed launch attempt before the fallback.
      - key: MEET_BOT_BROWSER_CHANNEL
        value: chromium
      # False on purpose: the container runs under Xvfb, so the browser is
      # headed on a machine with no monitor. Meeting clients behave better that
      # way — see the Dockerfile.
      - key: MEET_BOT_HEADLESS
        value: "false"
      - key: MEET_BOT_DISPLAY_NAME
        value: AI Interviewer
      - key: MEET_BOT_JOIN_LEAD_MINUTES
        value: "0"
      - key: MEET_BOT_CANDIDATE_WAIT_MINUTES
        value: "5"
      - key: MEET_BOT_CANDIDATE_GRACE_MINUTES
        value: "2"
      # Two browsers is about the limit of a 2 GB instance.
      - key: MEET_BOT_MAX_CONCURRENT
        value: "2"
      - key: MEET_BOT_TTS
        value: deepgram

      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_MS
        value: "60000"

      # Optional. Without these, invitations print to the log instead of being
      # sent, and recordings and resumes fall back to the container's disk.
      - key: API_KEY_FOR_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
